name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build for the iOS simulator
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build (no code signing)
        run: |
          xcodebuild build \
            -project ServiceOps.xcodeproj \
            -scheme ServiceOps \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Verify rack layout and response compatibility
        run: |
          xcrun swiftc ServiceOps/Models.swift ServiceOps/RackLayout.swift Tests/main.swift -o "$RUNNER_TEMP/serviceops-model-checks"
          "$RUNNER_TEMP/serviceops-model-checks"
